name: Validate cluster manifests
on:
  pull_request:
    paths: ['cluster/**', 'scripts/verify-cluster.py', 'scripts/verify-releases.py', '.github/workflows/validate-cluster.yaml']
  push:
    branches: [main]
    paths: ['cluster/**', 'scripts/verify-cluster.py', 'scripts/verify-releases.py', '.github/workflows/validate-cluster.yaml']
  merge_group:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - run: python scripts/verify-cluster.py
      # Renders every HelmRelease with helm (chart schema) and rejects immutable field
      # changes against the revision being replaced. Renovate only automerges when this passes.
      - run: python scripts/verify-releases.py --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
