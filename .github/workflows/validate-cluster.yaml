name: Validate cluster manifests
on:
  pull_request:
    paths: ['cluster/**', 'scripts/verify-cluster.py', '.github/workflows/validate-cluster.yaml']
  push:
    branches: [main]
    paths: ['cluster/**', 'scripts/verify-cluster.py', '.github/workflows/validate-cluster.yaml']
  merge_group:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 jsonschema==4.25.1
      - run: python scripts/verify-cluster.py
