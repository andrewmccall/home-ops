---
- name: download calico manifests
  get_url:
    url: "{{ calico_manifests_url }}/{{ item }}"
    dest: "/tmp/calico-{{ calico_version }}-{{ item }}"
    mode: '0664'
  loop:
    - operator-crds.yaml
    - tigera-operator.yaml
  # Only writes to /tmp, so --check can still diff the apply below.
  check_mode: no
  run_once: yes
  delegate_to: localhost

# CRDs first; they are too large for client-side apply. kubectl rather than
# kubernetes.core.k8s, whose server_side_apply fails here with "Object of type
# bytes is not JSON serializable". --check becomes a server-side dry run.
- name: install calico CRDs and tigera operator
  command: >-
    kubectl apply --server-side --force-conflicts --field-manager=ansible
    {{ '--dry-run=server' if ansible_check_mode else '' }}
    -f /tmp/calico-{{ calico_version }}-{{ item }}
  register: calico_apply
  changed_when: calico_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
  check_mode: no
  loop:
    - operator-crds.yaml
    - tigera-operator.yaml
  run_once: yes
  delegate_to: localhost

- name: add tigera operator configuration
  kubernetes.core.k8s:
    template: installation.yaml.j2
  run_once: yes
  delegate_to: localhost

- name: enable prometheus metrics in felixconfiguration
  kubernetes.core.k8s:
    api_version: crd.projectcalico.org/v1
    namespace: tigera-operator
    kind: felixconfiguration
    name: default
    definition:
      spec:
        prometheusMetricsEnabled: true
  run_once: yes
  delegate_to: localhost

- name: add bgp configuration
  kubernetes.core.k8s:
    template: bgpconfiguration.yaml.j2
  run_once: yes
  delegate_to: localhost

- name: add bgp peers configuration
  kubernetes.core.k8s:
    template: bgppeer.yaml.j2
  loop: "{{ calico_bgp_peers }}"
  run_once: yes
  delegate_to: localhost
