apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
  # The Flux webhook (core/flux-system/webhook) is published on the `external` Gateway,
  # which accepts routes only from namespaces labelled for it.
  - target:
      version: v1
      kind: Namespace
      name: flux-system
    patch: |-
      - op: add
        path: /metadata/labels/home-ops.andrewmccall.com~1public-routes
        value: "true"
  # Keep generated Flux manifests aligned with the k3s/CoreDNS cluster domain.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: (source-controller|kustomize-controller|helm-controller)
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.andrewmccall.com./
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: source-controller
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/args/6
        value: --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cluster.local.
      - op: replace
        path: /spec/template/spec/containers/0/args/6
        value: --storage-adv-addr=source-controller.$(RUNTIME_NAMESPACE).svc.cluster.andrewmccall.com.
  # source-controller peaked at 0.97Gi of its 1Gi limit (2026-11 audit); the request was 64Mi.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: source-controller
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/name
        value: manager
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1536Mi
  # GitHub webhooks (core/flux-system/webhook) trigger fetches on push; polling only
  # catches a missed delivery. `flux bootstrap` generates 1m0s.
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: GitRepository
      name: flux-system
    patch: |-
      - op: test
        path: /spec/interval
        value: 1m0s
      - op: replace
        path: /spec/interval
        value: 30m0s
