apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: agent-sandbox
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: crds
  path: ./cluster/core/agent-sandbox
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: agent-sandbox-controller
      namespace: agent-sandbox-system
