---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-config
  namespace: flux-system
data:
  K8S_CLUSTER_CIDR: 10.42.0.0/16
  K8S_SERVICE_CIDR: 10.43.0.0/16
  ROUTER_IP: 10.0.0.1
  # The home network (one subnet, no VLANs); NetworkPolicies use it for the few
  # pods the LAN may reach directly.
  LAN_CIDR: 10.0.0.0/23
  # The Envoy Gateways (apps/networking/envoy-gateway); Calico advertises them over BGP.
  INTERNAL_GATEWAY_IP: 10.44.0.20
  EXTERNAL_GATEWAY_IP: 10.44.0.21
  # The Cloudflare tunnel public hosts come in through (cloudflared/public.yaml).
  PUBLIC_TUNNEL_ID: 0a09b6f9-5b0b-4ad2-91f5-6773dc98e8b2
  COREDNS_IP: 10.44.0.2
  UNIFI_IP: 10.44.0.3
  MINECRAFT_IP: 10.44.10.44
  ETCD_EXTDNS_IP: 10.43.0.101
  CLUSTER_DOMAIN: cluster.andrewmccall.com
