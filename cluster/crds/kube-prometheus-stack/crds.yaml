---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: kube-prometheus-stack-crds
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/prometheus-community/helm-charts.git
  ref:
    # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts chart=kube-prometheus-stack
    tag: kube-prometheus-stack-92.16.1
  ignore: |
    # exclude all
    /*
    # include the crds subchart's plain CRD directory (charts/crds/crds since chart 4x;
    # the old path matched nothing, so CRDs stayed at their 2022 versions)
    !/charts/kube-prometheus-stack/charts/crds/crds
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-crds
  namespace: flux-system
spec:
  interval: 30m
  prune: false
  path: ./charts/kube-prometheus-stack/charts/crds/crds
  sourceRef:
    kind: GitRepository
    name: kube-prometheus-stack-crds