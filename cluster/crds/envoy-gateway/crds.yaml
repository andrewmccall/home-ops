---
# Envoy Gateway's own CRDs (EnvoyProxy, ClientTrafficPolicy, ...) for
# apps/networking/envoy-gateway, applied here so they exist before apps references them.
# The Gateway API CRDs themselves come from k3s (kube-system/gateway-api-crd), so the
# chart's copy is turned off. Keep the tag equal to the chart version; Renovate groups both.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 30m
  url: https://github.com/envoyproxy/gateway.git
  ref:
    tag: v1.10.0
  ignore: |
    # exclude all
    /*
    # include the plain generated CRDs
    !/charts/gateway-helm/charts/crds/crds/generated/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-crds
  namespace: flux-system
spec:
  interval: 30m
  prune: false
  sourceRef:
    kind: GitRepository
    name: envoy-gateway-crds
