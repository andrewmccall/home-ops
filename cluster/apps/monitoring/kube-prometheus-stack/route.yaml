---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - prometheus.${DOMAIN}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-prometheus
          port: 9090
# No login for now (nginx's oauth2 target no longer exists); LAN only, like Prometheus.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alert-manager
  namespace: monitoring
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - alert-manager.${DOMAIN}
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
