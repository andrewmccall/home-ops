---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
  labels:
    home-ops.andrewmccall.com/post-renderers: own
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      # renovate: datasource=helm registryUrl=https://prometheus-community.github.io/helm-charts chart=kube-prometheus-stack
      version: 93.1.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  # The chart always renders the multi-cluster dashboard; this is a single cluster.
  postRenderers:
    - kustomize:
        patches:
          # The cluster-wide default from cluster/base/apps.yaml, which own postRenderers replace.
          - target:
              kind: Deployment|StatefulSet|DaemonSet
            patch: |
              - op: add
                path: /spec/minReadySeconds
                value: 30
          - target:
              kind: ConfigMap
              name: kube-prometheus-stack-k8s-resources-multicluster
            patch: |-
              $patch: delete
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: kube-prometheus-stack-k8s-resources-multicluster
  values:
    alertmanager:
      # The chart's default config plus a Hermes receiver. It lives here rather than in
      # an AlertmanagerConfig because Hermes authenticates webhooks by a token header,
      # which only Alertmanager's own http_headers can send. See cluster/apps/hermes/README.md.
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
          - source_matchers: ['severity = critical']
            target_matchers: ['severity =~ warning|info']
            equal: [namespace, alertname]
          - source_matchers: ['severity = warning']
            target_matchers: ['severity = info']
            equal: [namespace, alertname]
          - source_matchers: ['alertname = InfoInhibitor']
            target_matchers: ['severity = info']
            equal: [namespace]
          - target_matchers: ['alertname = InfoInhibitor']
        route:
          group_by: [namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: 'null'
          routes:
            - matchers: ['alertname = "Watchdog"']
              receiver: 'null'
            # House device alerts are excluded as in the k3s upgrade gate
            # (cluster/core/system-upgrade/server-plan.yaml).
            - receiver: hermes
              matchers:
                - severity =~ "warning|critical"
                - alertname !~ "InfoInhibitor|ZigbeeDeviceOffline|ZigbeeBatteryLow|HeatingZoneUnavailable|VoiceSatelliteOffline"
              group_by: [alertname, namespace]
              # Hermes drops repeats it has already asked about; an hourly repeat lets a
              # "later" reminder arrive soon after its time.
              repeat_interval: 1h
        receivers:
          - name: 'null'
          - name: hermes
            webhook_configs:
              - url: http://hermes-webhook.hermes.svc:8644/webhooks/alertmanager
                send_resolved: true
                max_alerts: 20
                http_config:
                  http_headers:
                    X-Gitlab-Token:
                      files: [/etc/alertmanager/secrets/hermes-alert-webhook/token]
        templates:
          - /etc/alertmanager/config/*.tmpl
      alertmanagerSpec:
        secrets: [hermes-alert-webhook]
        # Without this the operator scopes an AlertmanagerConfig's route to its own
        # namespace, so a receiver in monitoring would miss house, flux-system and the rest.
        alertmanagerConfigMatcherStrategy:
          type: None
        # Silences and the notification log only; they are a few KB.
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          # The chart default, repeated because this list replaces it.
          - action: drop
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
            sourceLabels:
              - __name__
              - le
          # About 43k series that no dashboard or rule here reads.
          - action: drop
            regex: apiserver_request_body_size_bytes_bucket|apiserver_watch_.*|etcd_request_duration_seconds_bucket
            sourceLabels:
              - __name__
    kubelet:
      serviceMonitor:
        metricRelabelings:
          - action: replace
            sourceLabels:
              - node
            targetLabel: instance
          # k3s runs every component in one process, so the kubelet's /metrics also serves the
          # apiserver and etcd metrics the apiserver job already scrapes (about 114k series).
          # rest_client_* stays: the Kubelet dashboard reads it with job="kubelet".
          - action: drop
            regex: (apiserver|etcd|workqueue)_.*
            sourceLabels:
              - __name__
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 256Mi
    nodeExporter:
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 192Mi
        limits:
          memory: 384Mi
      metricLabelsAllowlist:
        - "persistentvolumeclaims=[*]"
      # gotk_resource_info for Flux objects, from fluxcd/flux2-monitoring-example@7ab65dc8
      # (monitoring/controllers/kube-prometheus-stack/kube-state-metrics-config.yaml),
      # keeping the default collectors the Kubernetes dashboards need.
      rbac:
        extraRules:
        - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
          resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
          - imagerepositories
          - imagepolicies
          - imageupdateautomations
          verbs:
          - list
          - watch
        # Off-site backup size and age for alerts/backup-rules.yaml.
        - apiGroups:
          - longhorn.io
          resources:
          - backupvolumes
          verbs:
          - list
          - watch
        # Route status for GatewayRouteNotAccepted (alerts/monitoring-rules.yaml).
        - apiGroups:
          - gateway.networking.k8s.io
          resources:
          - httproutes
          - grpcroutes
          verbs:
          - list
          - watch
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - lastAppliedRevision
                  source_name:
                  - spec
                  - sourceRef
                  - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - history
                  - '0'
                  - chartVersion
                  chart_name:
                  - status
                  - history
                  - '0'
                  - chartName
                  chart_app_version:
                  - status
                  - history
                  - '0'
                  - appVersion
                  chart_ref_name:
                  - spec
                  - chartRef
                  - name
                  chart_source_name:
                  - spec
                  - chart
                  - spec
                  - sourceRef
                  - name
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: Bucket
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Bucket resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  endpoint:
                  - spec
                  - endpoint
                  bucket_name:
                  - spec
                  - bucketName
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmChart resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  chart_name:
                  - spec
                  - chart
                  chart_version:
                  - spec
                  - version
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Alert
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Alert resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  suspended:
                  - spec
                  - suspend
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Provider
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Provider resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  suspended:
                  - spec
                  - suspend
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1
                kind: Receiver
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Receiver resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  webhook_path:
                  - status
                  - webhookPath
            - groupVersionKind:
                group: image.toolkit.fluxcd.io
                version: v1
                kind: ImageRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux ImageRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  image:
                  - spec
                  - image
            - groupVersionKind:
                group: image.toolkit.fluxcd.io
                version: v1
                kind: ImagePolicy
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux ImagePolicy resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  source_name:
                  - spec
                  - imageRepositoryRef
                  - name
            - groupVersionKind:
                group: image.toolkit.fluxcd.io
                version: v1
                kind: ImageUpdateAutomation
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux ImageUpdateAutomation resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  source_name:
                  - spec
                  - sourceRef
                  - name
            # gatewayapi_route_accepted: one series per route and parent Gateway listener,
            # 1 when that listener accepted the route, 0 when it refused it.
            - groupVersionKind:
                group: gateway.networking.k8s.io
                version: v1
                kind: HTTPRoute
              metricNamePrefix: gatewayapi
              commonLabels:
                route_kind: HTTPRoute
              labelsFromPath:
                exported_namespace:
                - metadata
                - namespace
                name:
                - metadata
                - name
              metrics:
              - name: route_accepted
                help: Whether the parent Gateway listener accepted the route (1) or refused it (0).
                each:
                  type: Gauge
                  gauge:
                    path:
                    - status
                    - parents
                    labelsFromPath:
                      gateway:
                      - parentRef
                      - name
                      section:
                      - parentRef
                      - sectionName
                    valueFrom:
                    - conditions
                    - '[type=Accepted]'
                    - status
            # gatewayapi_route_accepted: one series per route and parent Gateway listener,
            # 1 when that listener accepted the route, 0 when it refused it.
            - groupVersionKind:
                group: gateway.networking.k8s.io
                version: v1
                kind: GRPCRoute
              metricNamePrefix: gatewayapi
              commonLabels:
                route_kind: GRPCRoute
              labelsFromPath:
                exported_namespace:
                - metadata
                - namespace
                name:
                - metadata
                - name
              metrics:
              - name: route_accepted
                help: Whether the parent Gateway listener accepted the route (1) or refused it (0).
                each:
                  type: Gauge
                  gauge:
                    path:
                    - status
                    - parents
                    labelsFromPath:
                      gateway:
                      - parentRef
                      - name
                      section:
                      - parentRef
                      - sectionName
                    valueFrom:
                    - conditions
                    - '[type=Accepted]'
                    - status
            # Longhorn's off-site backups, one series per backed-up volume (alerts/backup-rules.yaml):
            # longhorn_crs_backup_volume_stored_bytes, what the volume's backups hold in R2;
            # longhorn_crs_backup_volume_last_backup_timestamp, Unix time of the newest backup.
            - groupVersionKind:
                group: longhorn.io
                version: v1beta2
                kind: BackupVolume
              metricNamePrefix: longhorn_crs
              labelsFromPath:
                volume:
                - spec
                - volumeName
                backup_volume:
                - metadata
                - name
              metrics:
              - name: backup_volume_stored_bytes
                help: Bytes the volume's backups hold in the backup target.
                each:
                  type: Gauge
                  gauge:
                    path:
                    - status
                    - dataStored
                    nilIsZero: true
              - name: backup_volume_last_backup_timestamp
                help: Unix time of the volume's newest backup.
                each:
                  type: Gauge
                  gauge:
                    path:
                    - status
                    - lastBackupAt
                    nilIsZero: true
      prometheus:
        monitor:
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels:
                - __meta_kubernetes_pod_node_name
              targetLabel: kubernetes_node
    prometheus:
      prometheusSpec:
        # Off: it can delete all metrics, and Prometheus is reachable from the whole LAN.
        enableAdminAPI: false
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        retention: 30d
        retentionSize: "10GB"
        walCompression: true
        # The limit also sets GOMEMLIMIT to about 90 % of it, so the GC works before the OOM killer.
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 20Gi
