---
# Rules the kube-prometheus-stack defaults do not cover. Node, pod, volume and
# target alerts come from the chart (NodeFilesystemSpaceFillingUp,
# KubePodCrashLooping, KubePodNotReady, KubePersistentVolumeFillingUp, TargetDown ...).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cluster-alerts
  namespace: monitoring
spec:
  groups:
    - name: pod-health
      rules:
        # Fires on the restart that followed an OOM kill, then resolves.
        - alert: PodOOMKilled
          expr: |
            (increase(kube_pod_container_status_restarts_total[15m]) > 0)
            and on (namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM killed"
            description: "The container hit its memory limit and restarted. Raise the limit or find the leak."

    - name: flux
      rules:
        # gotk_resource_info comes from kube-state-metrics custom resource state.
        - alert: FluxReconciliationFailure
          expr: max by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready="False"}) == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready"
            description: "Not ready for 15 minutes. A failed upgrade has been rolled back or is waiting for a fix: flux get {{ $labels.customresource_kind | toLower }} -n {{ $labels.exported_namespace }} {{ $labels.name }}"

        - alert: FluxSuspendedTooLong
          expr: max by (customresource_kind, exported_namespace, name) (gotk_resource_info{suspended="true"}) == 1
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} suspended for 24h+"

        - alert: FluxMetricsMissing
          expr: absent(gotk_resource_info{customresource_kind="HelmRelease"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No Flux HelmRelease state metrics; Flux failure alerts cannot fire"
