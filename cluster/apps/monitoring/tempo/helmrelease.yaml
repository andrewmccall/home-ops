---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: tempo
      # renovate: datasource=helm registryUrl=https://grafana.github.io/helm-charts chart=tempo
      version: 1.24.4
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    tempo:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        zipkin:
          endpoint: 0.0.0.0:9411
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/block
      retention: 336h  # 14 days
      # The chart reads tempo.resources; a top-level resources key is ignored. Peak was 1.06Gi.
      resources:
        requests:
          cpu: 20m
          memory: 768Mi
        limits:
          memory: 2Gi
    persistence:
      enabled: true
      size: 50Gi
    service:
      type: ClusterIP
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      ingressClassName: internal
      hosts:
        - host: tempo.${DOMAIN}
          paths:
            - path: /
              pathType: Prefix
