---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vector-agent
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: vector
      # renovate: datasource=helm registryUrl=https://helm.vector.dev chart=vector
      version: 0.61.0
      sourceRef:
        kind: HelmRepository
        name: vector
        namespace: flux-system
  dependsOn:
    - name: loki
      namespace: monitoring
  values:
    image:
      repository: timberio/vector
      # The chart copies tag into a label, which can't hold '@'; it joins tag@digest itself.
      # renovate-image-digest: depName=timberio/vector
      tag: 0.61.0-debian
      digest: sha256:f6c23b5a7e16fb2838d33619ef7acf4bad2289a7cf22bc90efc2371f520c4ea2
    role: Agent
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 640Mi
    customConfig:
      data_dir: /vector-data-dir
      api:
        enabled: false
      sources:
        journal_logs:
          type: journald
          journal_directory: /var/log/journal
        kubernetes_logs:
          type: kubernetes_logs
          # Loki logs each rejected write, which Vector would ship back to Loki: a loop
          # that filled the ingestion limit. Read these two with kubectl logs instead.
          extra_label_selector: "app.kubernetes.io/name!=loki,app.kubernetes.io/name!=vector"
        vector_metrics:
          type: internal_metrics
      sinks:
        # Straight to Loki: one node has no use for an aggregator hop.
        loki_journal:
          type: loki
          inputs:
            - journal_logs
          # Vector 0.61+ needs the scheme; a bare host:port fails with "client error (Connect)".
          endpoint: http://loki-gateway.monitoring.svc
          encoding:
            codec: json
          out_of_order_action: accept
          remove_timestamp: true
          labels:
            source: journal
            node: >-
              {{`{{ host }}`}}
            unit: >-
              {{`{{ _SYSTEMD_UNIT }}`}}
        loki_kubernetes:
          type: loki
          inputs:
            - kubernetes_logs
          endpoint: http://loki-gateway.monitoring.svc
          encoding:
            codec: json
          out_of_order_action: accept
          remove_timestamp: true
          labels:
            source: kubernetes
            node: >-
              {{`{{ kubernetes.pod_node_name }}`}}
            namespace: >-
              {{`{{ kubernetes.pod_namespace }}`}}
            pod: >-
              {{`{{ kubernetes.pod_name }}`}}
            container: >-
              {{`{{ kubernetes.container_name }}`}}
            app: >-
              {{`{{ kubernetes.pod_labels."app.kubernetes.io/name" }}`}}
            instance: >-
              {{`{{ kubernetes.pod_labels."app.kubernetes.io/instance" }}`}}
        prometheus_sink:
          type: prometheus_exporter
          inputs:
            - vector_metrics
          address: 0.0.0.0:9090
    service:
      enabled: false
    podMonitor:
      enabled: true
      jobLabel: vector-agent
      port: prometheus-sink
    securityContext:
      privileged: true
