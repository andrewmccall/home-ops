---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - config-pvc.yaml
  - helmrelease.yaml
  - route.yaml
# Dashboards kept in this repo; see ../README.md#dashboards. The Grafana sidecar loads
# every ConfigMap labelled grafana_dashboard into the folder named by grafana_folder.
# Flux substitution is off because Grafana and PromQL use $ themselves.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  - name: grafana-dashboards-home
    namespace: monitoring
    options:
      annotations:
        grafana_folder: Home
    files:
      - dashboards/home/home.json
