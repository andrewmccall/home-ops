---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: grafana
      # renovate: datasource=helm registryUrl=https://grafana.github.io/helm-charts chart=grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  # Runs the chart's test pod after each upgrade: Grafana must answer on its service.
  test:
    enable: true
  values:
    env:
      VAR_BLOCKY_URL: "http://blocky.networking.svc.${CLUSTER_DOMAIN}:4000"
    adminPassword: ${GRAFANA_ADMIN_PASSWORD}
    grafana.ini:
      analytics:
        check_for_updates: false
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
            isDefault: true
          - name: Loki
            type: loki
            access: proxy
            url: http://loki-gateway.monitoring.svc:80
          - name: Tempo
            type: tempo
            access: proxy
            url: http://tempo.monitoring.svc:3200
    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
      datasources:
        enabled: true
        searchNamespace: ALL
    # Grafana 12 refuses Angular plugins (piechart, worldmap, discrete); use the built-in panels.
    plugins:
      - grafana-clock-panel
      - pr0ps-trackmap-panel
      - vonage-status-panel
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: platform
            orgId: 1
            folder: Platform
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/platform
    dashboards:
      platform:
        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/cluster.json
          datasource: [{name: DS_PROMETHEUS, value: Prometheus}]
        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/control-plane.json
          datasource: [{name: DS_PROMETHEUS, value: Prometheus}]
        flux-logs:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/7ab65dc8b90f7a6751d88f18bbb4e1bee33bf334/monitoring/configs/dashboards/logs.json
          datasource: [{name: DS_LOKI, value: Loki}]
        longhorn:
          gnetId: 16888
          revision: 14
          datasource: [{name: DS_PROMETHEUS, value: Prometheus}]
        ingress-nginx:
          gnetId: 9614
          revision: 1
          datasource: [{name: DS_PROMETHEUS, value: Prometheus}]
        cert-manager:
          gnetId: 20842
          revision: 3
          datasource: [{name: DS_PROMETHEUS, value: Prometheus}]
        logs:
          gnetId: 13639
          revision: 2
          datasource: [{name: DS_LOKI, value: Loki}]
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        external-dns.home.arpa/enabled: "true"
        cert-manager.home.arpa/enabled: "true"
      hosts:
        - &host-grafana grafana.${DOMAIN}
      path: /
      pathType: Prefix
      tls:
        - hosts:
            - *host-grafana
          secretName: grafana-tls
    persistence:
      enabled: true
      existingClaim: grafana-config
