---
# Envoy Gateway: the Gateway API controller that replaces the retired ingress-nginx.
# It runs Envoy proxies in this namespace for the Gateways in gateway.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: networking
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      # renovate: datasource=docker image=docker.io/envoyproxy/gateway-helm
      version: v1.10.0
      sourceRef:
        kind: HelmRepository
        name: envoyproxy
        namespace: flux-system
  values:
    # The chart defaults to cluster.local, so the proxies looked for their control plane
    # at envoy-gateway.networking.svc.cluster.local and never got configuration.
    # certgen writes this domain into the control-plane certificates and does not
    # overwrite them: after changing it, delete the envoy, envoy-gateway, envoy-oidc-hmac
    # and envoy-rate-limit Secrets so the next upgrade regenerates them.
    kubernetesClusterDomain: ${CLUSTER_DOMAIN}
    # Envoy Gateway's CRDs come from cluster/crds/envoy-gateway, the Gateway API ones
    # from k3s.
    crds:
      enabled: false
    deployment:
      envoyGateway:
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            memory: 512Mi
