---
# Two Gateways: `internal` for LAN-only hosts, `external` for public ones. A route on
# `external` is published through the public Cloudflare tunnel (cloudflared/public.yaml,
# external-dns-cloudflare) and must come from a namespace labelled
# home-ops.andrewmccall.com/public-routes=true. The LAN reaches both directly.
# Routes attach with parentRefs { name: internal|external, namespace: networking }
# (cluster/apps/networking/README.md).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# Per-Gateway proxy settings. The Service name is fixed so the Cloudflare tunnel's
# origin (set in Zero Trust, not git) can name it once.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: envoy-internal
        # LoadBalancer, not ClusterIP: only then does Envoy Gateway put the Gateway's
        # addresses on the Service as externalIPs (ClusterIP would try to use them as
        # the cluster IP). No load-balancer controller is needed; Calico advertises them.
        type: LoadBalancer
        externalTrafficPolicy: Local
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: external
  namespace: networking
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        name: envoy-external
        # LoadBalancer, not ClusterIP: only then does Envoy Gateway put the Gateway's
        # addresses on the Service as externalIPs (ClusterIP would try to use them as
        # the cluster IP). No load-balancer controller is needed; Calico advertises them.
        type: LoadBalancer
        externalTrafficPolicy: Local
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: networking
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: internal
  # Becomes the Service's external IP, which Calico advertises over BGP.
  addresses:
    - type: IPAddress
      value: ${INTERNAL_GATEWAY_IP}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: ingress-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: networking
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: external
  addresses:
    - type: IPAddress
      value: ${EXTERNAL_GATEWAY_IP}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: ingress-tls
      # Attaching here makes a route public (cloudflared/public.yaml and
      # external-dns-cloudflare): only from namespaces labelled for it, so a stray
      # parentRef cannot expose a service.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              home-ops.andrewmccall.com/public-routes: "true"
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Plain HTTP only ever redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: networking
spec:
  parentRefs:
    - name: internal
      sectionName: http
    - name: external
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Envoy's default 15 s route timeout would cut off Music Assistant streams and
# long-lived websockets (Home Assistant, code-server, ESPHome logs). nginx only timed
# out after 60 s of silence; here a request has no total limit and a stream closes
# after an hour with no data.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: timeouts
  namespace: networking
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 1h
---
# Client address on the external Gateway. Tunnel traffic arrives from cloudflared pods,
# which pass the client in X-Forwarded-For; Envoy takes the right-most address not in
# these trusted ranges (the pod network and Cloudflare's published ranges, the same list
# nginx used), so a LAN client connecting directly cannot claim another address.
# Routes that need the address in a header set it with a RequestHeaderModifier filter,
# e.g. X-Real-IP: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%". That must be on the route:
# ClientTrafficPolicy earlyRequestHeaders run before this detection and would give the
# cloudflared pod's address. Cloudflare ranges: https://www.cloudflare.com/ips/
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: external-client-ip
  namespace: networking
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: external
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - ${K8S_CLUSTER_CIDR}
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 108.162.192.0/18
        - 131.0.72.0/22
        - 141.101.64.0/18
        - 162.158.0.0/15
        - 172.64.0.0/13
        - 173.245.48.0/20
        - 188.114.96.0/20
        - 190.93.240.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 2400:cb00::/32
        - 2405:8100::/32
        - 2405:b500::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
