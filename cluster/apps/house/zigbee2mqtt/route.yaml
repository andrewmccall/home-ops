---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: house
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - zigbee2mqtt.${DOMAIN}
  rules:
    - backendRefs:
        - name: zigbee2mqtt
          port: 8080
