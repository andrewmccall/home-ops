---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
  namespace: house
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      zigbee2mqtt:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Docker Hub, the project's official copy: the only registry Renovate gets release
              # dates from (with a token, for repos over 1,000 tags); see renovate.json5.
              repository: koenkk/zigbee2mqtt
              tag: 2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
            env:
              ZIGBEE2MQTT_DATA: /data
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: "mqtt://mosquitto.databases.svc.cluster.${DOMAIN}:1883"
              ZIGBEE2MQTT_CONFIG_MQTT_VERSION: 5
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyUSB0
              # Publishes <device>/availability, so a device that drops off shows offline
              # in Home Assistant and mqtt-exporter (mains devices after 10 min, battery after 25 h).
              ZIGBEE2MQTT_CONFIG_AVAILABILITY_ENABLED: "true"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            # Not privileged: the generic device plugin passes in only the USB coordinator
            # (resources.limits home-ops/zigbee), so the container needs no other host access.
            resources:
              requests:
                cpu: 20m
                memory: 300Mi
              limits:
                memory: 500Mi
                home-ops/zigbee: 1
    service:
      app:
        controller: zigbee2mqtt
        ports:
          http:
            port: 8080
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: zigbee2mqtt-data