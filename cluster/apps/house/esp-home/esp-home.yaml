---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esp-home
  namespace: house
spec:
  interval: 30m
  # Longer than the slowest startup probe, so a slow healthy start is not rolled back.
  timeout: 10m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      esphome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Docker Hub, the project's official copy: the only registry Renovate gets release
              # dates from (with a token, for repos over 1,000 tags); see renovate.json5.
              repository: esphome/esphome
              tag: 2026.10.2@sha256:c994a49a945094643b14c213bfd500a95ffed94cd68848772828192e126bd375
              pullPolicy: IfNotPresent
            probes:
              startup: {enabled: true, port: 6052, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 6052}
              liveness: {enabled: true, port: 6052, spec: {periodSeconds: 30, failureThreshold: 5}}
            env:
              TZ: Europe/London
              # From https://github.com/ptr727/ESPHome-NonRoot
              PLATFORMIO_CORE_DIR: /cache/pio
              # ESPHome "build_path" option, default is "/config/.esphome/build/[project]"
              ESPHOME_BUILD_PATH: /cache/build
              # ESPHome "data_dir" option, default is "/config/.esphome"
              ESPHOME_DATA_DIR: /cache/data
              # Set pip cache directory, default is "~/.cache/pip"
              PIP_CACHE_DIR: /cache/pip
            # Idle use is 0.14Gi; the 2Gi limit is headroom for PlatformIO compiles.
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
          code:
            image:
              repository: codercom/code-server
              tag: 4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
              pullPolicy: IfNotPresent
            probes:
              startup: {enabled: true, port: 8080, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 8080}
              liveness: {enabled: true, port: 8080, spec: {periodSeconds: 30, failureThreshold: 5}}
            args:
              - --disable-telemetry
              - --disable-update-check
              - --auth=none
              - --user-data-dir=/cache
              - --extensions-dir=/cache
              - /config
            resources:
              requests:
                cpu: 0m
                memory: 50Mi
              limits:
                cpu: 500m
                memory: 500Mi
    service:
      esphome:
        controller: esphome
        ports:
          http:
            port: 6052
          code:
            port: 8080
    persistence:
      config:
        existingClaim: esp-home-config
        globalMounts:
          - path: /config
      cache:
        existingClaim: esp-home-cache
        globalMounts:
          - path: /cache
      
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp