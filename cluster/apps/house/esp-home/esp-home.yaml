---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esp-home
  namespace: house
spec:
  interval: 30m
  # Longer than the slowest startup probe, so a slow healthy start is not rolled back.
  timeout: 10m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      esphome:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/esphome/esphome
              tag: 2026.10.0@sha256:1dff19a59070cdb523b76576cdc74d200f862d43c1407809088855920cf57145
              pullPolicy: IfNotPresent
            probes:
              startup: {enabled: true, port: 6052, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 6052}
              liveness: {enabled: true, port: 6052, spec: {periodSeconds: 30, failureThreshold: 5}}
            env:
              TZ: Europe/London
              # From https://github.com/ptr727/ESPHome-NonRoot
              PLATFORMIO_CORE_DIR: /cache/pio
              # ESPHome "build_path" option, default is "/config/.esphome/build/[project]"
              ESPHOME_BUILD_PATH: /cache/build
              # ESPHome "data_dir" option, default is "/config/.esphome"
              ESPHOME_DATA_DIR: /cache/data
              # Set pip cache directory, default is "~/.cache/pip"
              PIP_CACHE_DIR: /cache/pip
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          code:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
              pullPolicy: IfNotPresent
            probes:
              startup: {enabled: true, port: 8080, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 8080}
              liveness: {enabled: true, port: 8080, spec: {periodSeconds: 30, failureThreshold: 5}}
            args:
              - --disable-telemetry
              - --disable-update-check
              - --auth=none
              - --user-data-dir=/cache
              - --extensions-dir=/cache
              - /config
            resources:
              requests:
                cpu: 0m
                memory: 50Mi
              limits:
                cpu: 500m
                memory: 500Mi
    service:
      esphome:
        controller: esphome
        ports:
          http:
            port: 6052
          code:
            port: 8080
    ingress:
      esphome:
        className: internal
        hosts:
          - host: esphome.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: esphome
                  port: http
      code-server:
        className: internal
        hosts:
          - host: esphome-code.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: esphome
                  port: code
    persistence:
      config:
        existingClaim: esp-home-config
        globalMounts:
          - path: /config
      cache:
        existingClaim: esp-home-cache
        globalMounts:
          - path: /cache
      
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp