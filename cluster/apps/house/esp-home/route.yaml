---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome
  namespace: house
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - esphome.${DOMAIN}
  rules:
    - backendRefs:
        - name: esp-home
          port: 6052
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esphome-code
  namespace: house
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - esphome-code.${DOMAIN}
  rules:
    - backendRefs:
        - name: esp-home
          port: 8080
