# Streams are long-lived; the Gateways' BackendTrafficPolicy sets no request timeout.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-assistant
  namespace: house
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - music-assistant.${DOMAIN}
  rules:
    - backendRefs:
        - name: music-assistant
          port: 8095
