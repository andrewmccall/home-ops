---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
  namespace: house
spec:
  interval: 30m
  # Longer than the slowest startup probe, so a slow healthy start is not rolled back.
  timeout: 10m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: vecna
      labels:
        home-ops.andrewmccall.com/mdns-relay: music-assistant
    controllers:
      music-assistant:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/music-assistant/server
              tag: 2.10.8@sha256:661e88bea76a9e79f38feca791f6c7373376ab60766ee01f56b66418ca243b68
              pullPolicy: IfNotPresent
            probes:
              startup: {enabled: true, port: 8095, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 8095}
              liveness: {enabled: true, port: 8095, spec: {periodSeconds: 30, failureThreshold: 5}}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
    service:
      music-assistant:
        controller: music-assistant
        ports:
          http:
            port: 8095
          streaming:
            port: 8097
          streaming-other:
            port: 8098
          sendspin:
            port: 8927
    ingress:
      music-assistant:
        className: internal
        annotations:
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-buffering: "off"
        hosts:
          - host: music-assistant.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: music-assistant
                  port: http
    persistence:
      config:
        existingClaim: music-assistant-data
        globalMounts:
          - path: /data
