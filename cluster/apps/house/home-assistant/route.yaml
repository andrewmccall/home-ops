# Replaces the chart's Ingresses once Envoy Gateway takes over (apps/networking/envoy-gateway).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: house
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
  hostnames:
    - home-assistant.${DOMAIN}
  rules:
    - backendRefs:
        - name: home-assistant-app
          port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-code
  namespace: house
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - home-assistant-code.${DOMAIN}
  rules:
    - backendRefs:
        - name: home-assistant-app
          port: 12321
