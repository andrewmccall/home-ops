# `external` makes Home Assistant public (the house namespace is labelled for it).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: house
spec:
  parentRefs:
    - name: external
      namespace: networking
      sectionName: https
  hostnames:
    - home-assistant.${DOMAIN}
  rules:
    # Tesla Fleet's public key (tesla-public-key.yaml); an exact match wins over "/".
    - matches:
        - path:
            type: Exact
            value: /.well-known/appspecific/com.tesla.3p.public-key.pem
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: tesla-public-key
    - backendRefs:
        - name: home-assistant-app
          port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-code
  namespace: house
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - home-assistant-code.${DOMAIN}
  rules:
    - backendRefs:
        - name: home-assistant-app
          port: 12321
