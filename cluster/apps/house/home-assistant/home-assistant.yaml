---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: house
spec:
  interval: 30m
  # Longer than the slowest startup probe, so a slow healthy start is not rolled back.
  timeout: 15m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Docker Hub, the project's official copy: the only registry Renovate gets release
              # dates from (with a token, for repos over 1,000 tags); see renovate.json5.
              repository: homeassistant/home-assistant
              tag: 2026.11.2@sha256:493a07e8f6530fc640223f4a0a5248f20a61ca2f718bb1d31efbf08a2c5ea28f
            probes:
              startup: {enabled: true, port: 8123, spec: {periodSeconds: 10, failureThreshold: 60}}
              readiness: {enabled: true, port: 8123}
              liveness: {enabled: true, port: 8123, spec: {periodSeconds: 30, failureThreshold: 5}}
            env:
              TZ: Europe/London
              HASS_HTTP_TRUSTED_PROXY_1: ${K8S_CLUSTER_CIDR}
              OPENAI_BASE_URL: http://hermes-api.hermes.svc:8642/v1
            # Without a memory request Kubernetes reserves the whole limit. Peak was 0.83Gi.
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: codercom/code-server
              tag: 4.145.2@sha256:09565f9e07f5624554e295e8bab0e2fec4a7c533eb3cff459ed6596a4d3d7c1c
            probes:
              startup: {enabled: true, port: 12321, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 12321}
              liveness: {enabled: true, port: 12321, spec: {periodSeconds: 30, failureThreshold: 5}}
            args: [
              "--auth", "none",
              "--user-data-dir", "/config/.vscode",
              "--extensions-dir", "/config/.vscode",
              "--port", "12321",
              "/config"
            ]
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
      voice:
        containers:
          whisper:
            image:
              repository: rhasspy/wyoming-whisper
              # renovate: datasource=docker rhasspy/wyoming-whisper
              tag: 3.9.1@sha256:ac3fdbdb4d6d7c5899634a63cfe4bac78634d27c7a1b061b2bb5d8f1054853b5
            probes:
              startup: {enabled: true, port: 10300, spec: {periodSeconds: 10, failureThreshold: 60}}
              readiness: {enabled: true, port: 10300}
              liveness: {enabled: true, port: 10300, spec: {periodSeconds: 30, failureThreshold: 5}}
            # Peak 0.42Gi with the current model; the limit stops a larger model taking the node.
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 1536Mi
          piper:
            image:
              repository: rhasspy/wyoming-piper
              # renovate: datasource=docker rhasspy/wyoming-piper
              tag: 2.5.4@sha256:333622ab9e4bcd00c80a37219b90a1a9d6aa3fd1ad34e0a6e3bddd36ee999efd
            probes:
              startup: {enabled: true, port: 10200, spec: {periodSeconds: 10, failureThreshold: 60}}
              readiness: {enabled: true, port: 10200}
              liveness: {enabled: true, port: 10200, spec: {periodSeconds: 30, failureThreshold: 5}}
            args: ["--voice", "en_GB-cori-high"]
            resources:
              requests:
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
          code-server:
            port: 12321
      voice: 
        controller: voice
        ports: 
          whisper-wyoming:
            port: 10300
          piper-wyoming:
            port: 10200
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      whisper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            whisper:
              - path: /data
      piper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            piper:
              - path: /data
