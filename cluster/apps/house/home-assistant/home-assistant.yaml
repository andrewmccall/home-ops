---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: house
spec:
  interval: 30m
  # Longer than the slowest startup probe, so a slow healthy start is not rolled back.
  timeout: 15m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              # renovate: datasource=docker tag=home-assistant/home-assistant
              tag: 2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
            probes:
              startup: {enabled: true, port: 8123, spec: {periodSeconds: 10, failureThreshold: 60}}
              readiness: {enabled: true, port: 8123}
              liveness: {enabled: true, port: 8123, spec: {periodSeconds: 30, failureThreshold: 5}}
            env:
              TZ: Europe/London
              HASS_HTTP_TRUSTED_PROXY_1: ${K8S_CLUSTER_CIDR}
              OPENAI_BASE_URL: http://hermes-api.hermes.svc:8642/v1
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.141.1@sha256:bfe06d7f36273d84a61d6bf2f9656b9f612f9c5c6fbb45ba5e19a29b42ded6f4
            probes:
              startup: {enabled: true, port: 12321, spec: {periodSeconds: 10, failureThreshold: 30}}
              readiness: {enabled: true, port: 12321}
              liveness: {enabled: true, port: 12321, spec: {periodSeconds: 30, failureThreshold: 5}}
            args: [
              "--auth", "none",
              "--user-data-dir", "/config/.vscode",
              "--extensions-dir", "/config/.vscode",
              "--port", "12321",
              "/config"
            ]
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
      voice:
        containers:
          whisper:
            image:
              repository: rhasspy/wyoming-whisper
              # renovate: datasource=docker rhasspy/wyoming-whisper
              tag: 3.8.1@sha256:ba6fcb6056ebe237d15a325381763a80af2fc8fcedaa04f6a714a7375eb20d80
            probes:
              startup: {enabled: true, port: 10300, spec: {periodSeconds: 10, failureThreshold: 60}}
              readiness: {enabled: true, port: 10300}
              liveness: {enabled: true, port: 10300, spec: {periodSeconds: 30, failureThreshold: 5}}
          piper:
            image:
              repository: rhasspy/wyoming-piper
              # renovate: datasource=docker rhasspy/wyoming-piper
              tag: 2.5.2@sha256:7d39aafac409c2b6b09d999ed04d84c311d632e558b35baa60fad6aac722af7a
            probes:
              startup: {enabled: true, port: 10200, spec: {periodSeconds: 10, failureThreshold: 60}}
              readiness: {enabled: true, port: 10200}
              liveness: {enabled: true, port: 10200, spec: {periodSeconds: 30, failureThreshold: 5}}
            args: ["--voice", "en_GB-cori-high"]
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
          code-server:
            port: 12321
      voice: 
        controller: voice
        ports: 
          whisper-wyoming:
            port: 10300
          piper-wyoming:
            port: 10200
    ingress:
      app:
        className: external
        hosts:
          - host: home-assistant.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
      code-server:
        className: internal
        hosts:
          - host: home-assistant-code.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: code-server
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      whisper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            whisper:
              - path: /data
      piper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            piper:
              - path: /data
