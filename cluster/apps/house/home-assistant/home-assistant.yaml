---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: house
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-merge-openai-ca:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
            command:
              - sh
              - -lc
              - |
                set -eu
                base_ca=""
                for candidate in /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
                  if [ -f "$candidate" ]; then
                    base_ca="$candidate"
                    break
                  fi
                done
                if [ -z "$base_ca" ]; then
                  echo "No system CA bundle found" >&2
                  exit 1
                fi
                cat "$base_ca" /openai-ca/ca.pem > /work/combined-ca.pem
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              # renovate: datasource=docker tag=home-assistant/home-assistant
              tag: 2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
            env:
              TZ: Europe/London
              HASS_HTTP_TRUSTED_PROXY_1: ${K8S_CLUSTER_CIDR}
              # Append the spoof CA to the default trust bundle so other integrations keep working.
              REQUESTS_CA_BUNDLE: /work/combined-ca.pem
            hostAliases:
              - ip: "10.44.0.20"
                hostnames:
                  - "api.openai.com"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.137.0@sha256:57ac684d44deb6fa94317b3e8f3e128dd7fb897fffd95b4efcd16f56ce607971
            args: [
              "--auth", "none",
              "--user-data-dir", "/config/.vscode",
              "--extensions-dir", "/config/.vscode",
              "--port", "12321",
              "/config"
            ]
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
      voice:
        containers:
          whisper:
            image:
              repository: rhasspy/wyoming-whisper
              # renovate: datasource=docker rhasspy/wyoming-whisper
              tag: 3.8.0@sha256:c3c6a1bca0b72ad8df0fbb00d315ff58f349270d3c40b9611b8a7f6ae28fd58f
          piper:
            image:
              repository: rhasspy/wyoming-piper
              # renovate: datasource=docker rhasspy/wyoming-piper
              tag: 2.5.0@sha256:765ed9fb6cb96dc36d687ada7b90fe846bd3219bc005192e0bdf192d8ad48692
            args: ["--voice", "en_GB-cori-high"]
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
          code-server:
            port: 12321
      voice: 
        controller: voice
        ports: 
          whisper-wyoming:
            port: 10300
          piper-wyoming:
            port: 10200
    ingress:
      app:
        className: external
        hosts:
          - host: home-assistant.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
      code-server:
        className: internal
        hosts:
          - host: home-assistant-code.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: code-server
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      openai-ca:
        type: configMap
        name: openai-internal-ca
        advancedMounts:
          home-assistant:
            init-merge-openai-ca:
              - path: /openai-ca/ca.pem
                subPath: ca.pem
            app:
              - path: /config/certs/openai-internal-ca.pem
                subPath: ca.pem
      ca-bundle-workdir:
        type: emptyDir
        advancedMounts:
          home-assistant:
            init-merge-openai-ca:
              - path: /work
            app:
              - path: /work
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      whisper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            whisper-wyoming:
              - path: /data
      piper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            piper-wyoming:
              - path: /data
