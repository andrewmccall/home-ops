---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: house
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-merge-openai-ca:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              tag: 2026.9.1@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
            command:
              - sh
              - -lc
              - |
                set -eu
                base_ca=""
                for candidate in /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
                  if [ -f "$candidate" ]; then
                    base_ca="$candidate"
                    break
                  fi
                done
                if [ -z "$base_ca" ]; then
                  echo "No system CA bundle found" >&2
                  exit 1
                fi
                cat "$base_ca" /openai-ca/ca.pem > /work/combined-ca.pem
        containers:
          app:
            image:
              repository: ghcr.io/home-assistant/home-assistant
              # renovate: datasource=docker tag=home-assistant/home-assistant
              tag: 2026.9.1@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
            env:
              TZ: Europe/London
              HASS_HTTP_TRUSTED_PROXY_1: ${K8S_CLUSTER_CIDR}
              # Append the spoof CA to the default trust bundle so other integrations keep working.
              REQUESTS_CA_BUNDLE: /work/combined-ca.pem
            hostAliases:
              - ip: "10.44.0.20"
                hostnames:
                  - "api.openai.com"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.135.0@sha256:ccd326184d71efc5ebb94155eda7bb30153902342a35dbc8525450d81aa55012
            args: [
              "--auth", "none",
              "--user-data-dir", "/config/.vscode",
              "--extensions-dir", "/config/.vscode",
              "--port", "12321",
              "/config"
            ]
            securityContext:
              runAsUser: 0
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
      voice:
        containers:
          whisper:
            image:
              repository: rhasspy/wyoming-whisper
              # renovate: datasource=docker rhasspy/wyoming-whisper
              tag: 3.7.0@sha256:ea74afa3e3c347cd031d946b4950b7438ae4bfd07ef96a04ac8a7095f36f4ac6
          piper:
            image:
              repository: rhasspy/wyoming-piper
              # renovate: datasource=docker rhasspy/wyoming-piper
              tag: 2.4.3@sha256:f7aaafe325d18979f43a9fe8bb4db494ba28ce8c109cb982983157817705ff87
            args: ["--voice", "en_GB-cori-high"]
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
          code-server:
            port: 12321
      voice: 
        controller: voice
        ports: 
          whisper-wyoming:
            port: 10300
          piper-wyoming:
            port: 10200
    ingress:
      app:
        className: external
        hosts:
          - host: home-assistant.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
      code-server:
        className: internal
        hosts:
          - host: home-assistant-code.${DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: code-server
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
      openai-ca:
        type: configMap
        name: openai-internal-ca
        advancedMounts:
          home-assistant:
            init-merge-openai-ca:
              - path: /openai-ca/ca.pem
                subPath: ca.pem
            app:
              - path: /config/certs/openai-internal-ca.pem
                subPath: ca.pem
      ca-bundle-workdir:
        type: emptyDir
        advancedMounts:
          home-assistant:
            init-merge-openai-ca:
              - path: /work
            app:
              - path: /work
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      whisper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            whisper-wyoming:
              - path: /data
      piper-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 50Gi
        advancedMounts:
          voice:
            piper-wyoming:
              - path: /data
