apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - api-keys.sops.yaml
  - sandbox.yaml
  - networkpolicy.yaml
  - service.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
      - SOUL.md
  - name: hermes-trust
    files:
      - sproozi-tasks-ca.crt
  - name: hermes-sre
    files:
      - sre/sre_alerts.py
      - sre/SKILL.md
    # Copied verbatim: Flux must not substitute variables in the script or skill.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
