apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - api-keys.sops.yaml
  - sandbox.yaml
  - networkpolicy.yaml
  - service.yaml
configMapGenerator:
  # Read-only at /etc/hermes: settings Hermes cannot change (managed scope).
  - name: hermes-managed
    files:
      - config.yaml=managed/config.yaml
  # First-start defaults Hermes then owns, and the init container's script.
  - name: hermes-seed
    files:
      - config.yaml=seed/config.yaml
      - SOUL.md=seed/SOUL.md
      - init.py
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: hermes-trust
    files:
      - sproozi-tasks-ca.crt
  - name: hermes-sre
    files:
      - sre/sre_alerts.py
      - sre/SKILL.md
    # Copied verbatim: Flux must not substitute variables in the script or skill.
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
