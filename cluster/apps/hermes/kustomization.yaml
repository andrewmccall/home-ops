apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - namespace.yaml
  - api-keys.sops.yaml
  - sandbox.yaml
  - networkpolicy.yaml
  - service.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - config.yaml
  - name: hermes-trust
    files:
      - sproozi-tasks-ca.crt
generatorOptions:
  disableNameSuffixHash: true
