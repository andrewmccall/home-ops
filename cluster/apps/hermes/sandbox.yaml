apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: hermes
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          image: &image nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          command: [python3, -c]
          args:
            - |
              import os, pathlib, shutil
              # config.yaml and SOUL.md (Ada's identity) are owned by Git.
              for name in ('config.yaml', 'SOUL.md'):
                  shutil.copyfile(f'/etc/hermes/{name}', f'/opt/data/{name}')
                  os.chown(f'/opt/data/{name}', 10000, 10000)
              workspace = pathlib.Path('/opt/data/workspace')
              workspace.mkdir(exist_ok=True)
              os.chown(workspace, 10000, 10000)
              # The image's public roots plus the private CA of the Sproozi task service.
              bundle = open('/etc/ssl/certs/ca-certificates.crt').read() + open('/etc/hermes-trust/sproozi-tasks-ca.crt').read()
              pathlib.Path('/etc/hermes-ca/ca-bundle.pem').write_text(bundle)
              # Alert triage: the webhook route's script and the skill (cluster/apps/hermes/sre).
              for source, target in (('sre_alerts.py', 'scripts/sre_alerts.py'), ('SKILL.md', 'skills/devops/sre-alerts/SKILL.md')):
                  path = pathlib.Path('/opt/data', target)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(f'/etc/hermes-sre/{source}', path)
                  for owned in (path, *path.relative_to('/opt/data').parents):
                      os.chown(pathlib.Path('/opt/data', owned), 10000, 10000)
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /etc/hermes
              readOnly: true
            - name: trust
              mountPath: /etc/hermes-trust
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/hermes-ca
            - name: sre
              mountPath: /etc/hermes-sre
              readOnly: true
      containers:
        - name: hermes
          image: *image
          args: [gateway, run]
          workingDir: /opt/data/workspace
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: API_SERVER_KEY
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: HOME_ASSISTANT_TOKEN
            - name: SPROOZI_TASK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: SPROOZI_TASK_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: ANTHROPIC_API_KEY
            - name: ALERTMANAGER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: ALERTMANAGER_WEBHOOK_TOKEN
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: TELEGRAM_BOT_TOKEN
            # Andrew's Telegram user ID: the only account the bot answers, and the
            # chat webhook results are delivered to.
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: TELEGRAM_USER_ID
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: TELEGRAM_USER_ID
            - name: SSL_CERT_FILE
              value: /etc/hermes-ca/ca-bundle.pem
            - name: REQUESTS_CA_BUNDLE
              value: /etc/hermes-ca/ca-bundle.pem
          ports:
            - name: api
              containerPort: 8642
            - name: webhook
              containerPort: 8644
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: api
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: ca-bundle
              mountPath: /etc/hermes-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: trust
          configMap:
            name: hermes-trust
        - name: ca-bundle
          emptyDir:
            sizeLimit: 4Mi
        - name: sre
          configMap:
            name: hermes-sre
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
