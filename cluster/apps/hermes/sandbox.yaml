apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: hermes
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          image: &image nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          command: [python3, /etc/hermes-seed/init.py]
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: seed
              mountPath: /etc/hermes-seed
              readOnly: true
            - name: managed
              mountPath: /etc/hermes
              readOnly: true
            - name: trust
              mountPath: /etc/hermes-trust
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/hermes-ca
            - name: sre
              mountPath: /etc/hermes-sre
              readOnly: true
      containers:
        - name: hermes
          image: *image
          args: [gateway, run]
          workingDir: /opt/data/workspace
          env:
            - name: HERMES_HOME
              value: /opt/data
            # File tools may write only inside Hermes's own volume.
            - name: HERMES_WRITE_SAFE_ROOT
              value: /opt/data
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: API_SERVER_KEY
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: HOME_ASSISTANT_TOKEN
            - name: SPROOZI_TASK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: SPROOZI_TASK_TOKEN
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: ANTHROPIC_API_KEY
            - name: ALERTMANAGER_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: ALERTMANAGER_WEBHOOK_TOKEN
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: TELEGRAM_BOT_TOKEN
            # Andrew's Telegram user ID: the only account the bot answers, and the
            # chat webhook results are delivered to.
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: TELEGRAM_USER_ID
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: TELEGRAM_USER_ID
            - name: SSL_CERT_FILE
              value: /etc/hermes-ca/ca-bundle.pem
            - name: REQUESTS_CA_BUNDLE
              value: /etc/hermes-ca/ca-bundle.pem
          ports:
            - name: api
              containerPort: 8642
            - name: webhook
              containerPort: 8644
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: api
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Hermes's managed scope: Git-pinned settings it can read but not change.
            - name: managed
              mountPath: /etc/hermes
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/hermes-ca
              readOnly: true
      volumes:
        - name: seed
          configMap:
            name: hermes-seed
        - name: managed
          configMap:
            name: hermes-managed
        - name: trust
          configMap:
            name: hermes-trust
        - name: ca-bundle
          emptyDir:
            sizeLimit: 4Mi
        - name: sre
          configMap:
            name: hermes-sre
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
