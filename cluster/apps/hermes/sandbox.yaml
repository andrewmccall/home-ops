apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: hermes
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: configure
          image: &image nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
          command: [python3, -c]
          args:
            - |
              import os, pathlib, shutil
              shutil.copyfile('/etc/hermes/config.yaml', '/opt/data/config.yaml')
              os.chown('/opt/data/config.yaml', 10000, 10000)
              workspace = pathlib.Path('/opt/data/workspace')
              workspace.mkdir(exist_ok=True)
              os.chown(workspace, 10000, 10000)
              # The image's public roots plus the private CA of the Sproozi task service.
              bundle = open('/etc/ssl/certs/ca-certificates.crt').read() + open('/etc/hermes-trust/sproozi-tasks-ca.crt').read()
              pathlib.Path('/etc/hermes-ca/ca-bundle.pem').write_text(bundle)
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config
              mountPath: /etc/hermes
              readOnly: true
            - name: trust
              mountPath: /etc/hermes-trust
              readOnly: true
            - name: ca-bundle
              mountPath: /etc/hermes-ca
      containers:
        - name: hermes
          image: *image
          args: [gateway, run]
          workingDir: /opt/data/workspace
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: OPENROUTER_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: API_SERVER_KEY
            - name: HOME_ASSISTANT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: HOME_ASSISTANT_TOKEN
            - name: SPROOZI_TASK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-api-keys
                  key: SPROOZI_TASK_TOKEN
            - name: SSL_CERT_FILE
              value: /etc/hermes-ca/ca-bundle.pem
            - name: REQUESTS_CA_BUNDLE
              value: /etc/hermes-ca/ca-bundle.pem
          ports:
            - name: api
              containerPort: 8642
          startupProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: api
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: '2'
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: ca-bundle
              mountPath: /etc/hermes-ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hermes-config
        - name: trust
          configMap:
            name: hermes-trust
        - name: ca-bundle
          emptyDir:
            sizeLimit: 4Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
