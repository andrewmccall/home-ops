# Applied by the Authentik worker on start and whenever this changes. Groups, apps and
# who may use each live here; users and passwords live in Authentik (README.md).
# Each client secret comes from secrets.sops.yaml (!Env) and is shared with its app.
version: 1
metadata:
  name: home-ops
entries:
  # Run the cluster: Authentik admin, Grafana Admin, Longhorn.
  - model: authentik_core.group
    identifiers:
      name: admins
    attrs:
      is_superuser: true
  # Use the house's apps: Grafana Viewer.
  - model: authentik_core.group
    identifiers:
      name: household

  # Grafana: its own OIDC login; Grafana reads the groups claim for the role.
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: Grafana
    attrs: &oidc
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.${DOMAIN}/login/generic_oauth
  - model: authentik_core.application
    id: grafana
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://grafana.${DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      group: !Find [authentik_core.group, [name, household]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf grafana
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 1

  # Longhorn UI: no login of its own, so the Envoy Gateway does the OIDC login
  # (core/longhorn/securitypolicy.yaml). Admins only.
  - model: authentik_providers_oauth2.oauth2provider
    id: longhorn-provider
    identifiers:
      name: Longhorn
    attrs:
      <<: *oidc
      client_id: longhorn
      client_secret: !Env LONGHORN_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://longhorn.${DOMAIN}/oauth2/callback
  - model: authentik_core.application
    id: longhorn
    identifiers:
      slug: longhorn
    attrs:
      name: Longhorn
      provider: !KeyOf longhorn-provider
      meta_launch_url: https://longhorn.${DOMAIN}
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf longhorn
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
