apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - secrets.sops.yaml
  - database.yaml
  - helmrelease.yaml
  - route.yaml
configMapGenerator:
  - name: authentik-blueprints
    namespace: authentik
    files:
      - blueprints.yaml
generatorOptions:
  disableNameSuffixHash: true
