---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  # The first install waits for the database to come up.
  timeout: 10m
  chart:
    spec:
      chart: authentik
      # renovate: datasource=helm registryUrl=https://charts.goauthentik.io chart=authentik
      version: 2026.8.5
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  values:
    global:
      # Docker Hub, so Renovate can date releases; same image as ghcr.io.
      image:
        repository: authentik/server
        tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
      envFrom:
        - secretRef:
            name: authentik-secrets
      env:
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-db-app
              key: password
    authentik:
      postgresql:
        host: authentik-db-rw
      error_reporting:
        enabled: false
    # Group, application and provider definitions (blueprints.yaml).
    blueprints:
      configMaps:
        - authentik-blueprints
    # Only needed for outposts Authentik deploys itself; the embedded one is enough.
    serviceAccount:
      create: false
    server:
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
    worker:
      resources:
        requests:
          cpu: 50m
          memory: 384Mi
        limits:
          memory: 1Gi
    prometheus:
      rules:
        enabled: true
