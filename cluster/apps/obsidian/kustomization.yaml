apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - secrets.sops.yaml
  - couchdb.yaml
  - setup.yaml
  - route.yaml
  # The bridge to Hermes, in the hermes namespace.
  - bridge
configMapGenerator:
  - name: couchdb-config
    namespace: obsidian
    files:
      - livesync.ini
  - name: couchdb-setup
    namespace: obsidian
    files:
      - setup.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
