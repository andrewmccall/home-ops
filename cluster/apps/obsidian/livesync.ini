; Self-hosted LiveSync's required CouchDB settings
; (https://github.com/vrtmrz/obsidian-livesync/blob/main/docs/setup_own_server.md).
[couchdb]
single_node = true
max_document_size = 50000000

; One node, so one copy of each database (the default of 3 fails).
[cluster]
n = 1

[chttpd]
require_valid_user = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

; The Obsidian apps' origins: desktop, iOS/Android, and the mobile dev build.
[cors]
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600

; Metrics without credentials on a port only Prometheus can reach (networkpolicy.yaml).
[prometheus]
additional_port = true
bind_address = 0.0.0.0
port = 17986
