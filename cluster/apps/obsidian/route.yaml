---
# LAN and VPN only: the Obsidian apps sync here with the `obsidian` user.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: couchdb
  namespace: obsidian
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - obsidian.${DOMAIN}
  rules:
    - backendRefs:
        - name: couchdb
          port: 5984
