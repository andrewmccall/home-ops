apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes
resources:
  - config.sops.yaml
  - bridge.yaml
configMapGenerator:
  - name: livesync-bridge-install
    files:
      - install.sh
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
