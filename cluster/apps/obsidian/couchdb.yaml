---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  namespace: obsidian
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian
  labels:
    app.kubernetes.io/name: couchdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: couchdb
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 5984
        seccompProfile:
          type: RuntimeDefault
      # The entrypoint chowns everything under /opt/couchdb and exits if it cannot,
      # so the settings are written into a writable local.d rather than mounted there.
      # LiveSync deletes and recreates the database when a vault is initialised or
      # rebuilt, which takes a server admin and wipes per-database permissions, so
      # the apps' user and the bridge's are server admins, defined here on every start. CouchDB
      # hashes the password when it loads the file.
      initContainers:
        - name: config
          image: &image couchdb:3.5.2.1@sha256:5fc596110eac7f412173a7d9de14f70aa5d3e816790fb6e70642755d4a4cf464
          command:
            - sh
            - -c
            - |
              cp /config/livesync.ini /local.d/10-livesync.ini
              printf '[admins]\nobsidian = %s\nbridge = %s\n' "$OBSIDIAN_PASSWORD" "$BRIDGE_PASSWORD" > /local.d/20-admins.ini
          env:
            - name: OBSIDIAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: OBSIDIAN_PASSWORD
            - name: BRIDGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: BRIDGE_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: local-d
              mountPath: /local.d
      containers:
        - name: couchdb
          image: *image
          envFrom:
            - secretRef:
                name: couchdb
          ports:
            - name: http
              containerPort: 5984
            - name: metrics
              containerPort: 17986
          # require_valid_user puts every path on the main port behind a login, so the
          # probes use the open metrics port.
          readinessProbe:
            httpGet:
              path: /_node/_local/_prometheus
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_node/_local/_prometheus
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: local-d
              mountPath: /opt/couchdb/etc/local.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
        - name: config
          configMap:
            name: couchdb-config
        # Also holds docker.ini, where the entrypoint writes the admin from the Secret.
        - name: local-d
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb
  namespace: obsidian
  labels:
    app.kubernetes.io/name: couchdb
spec:
  selector:
    app.kubernetes.io/name: couchdb
  ports:
    - name: http
      port: 5984
      targetPort: http
    - name: metrics
      port: 17986
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: couchdb
  namespace: obsidian
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: couchdb
  endpoints:
    - port: metrics
      path: /_node/_local/_prometheus
      interval: 60s
