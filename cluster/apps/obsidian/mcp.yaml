---
# Hermes's way into the vault: obsidian-livesync-mcp
# (github.com/adambenhassen/obsidian-livesync-mcp), an MCP server with note tools
# (list, read, write, append, move, delete, search). A bundled livesync-cli keeps
# a plain-file copy (vault) in sync with CouchDB; the tools edit those files.
# Its CLI predates LiveSync's NFC file identity, so the vault uses Legacy
# identity (README.md). No API key: networkpolicy.yaml admits only Hermes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: livesync-mcp-vault
  namespace: obsidian
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# livesync-cli's local database (its copy of the CouchDB documents).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: livesync-mcp-db
  namespace: obsidian
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livesync-mcp
  namespace: obsidian
  labels:
    app.kubernetes.io/name: livesync-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: livesync-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livesync-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/adambenhassen/obsidian-livesync-mcp:0.2.4@sha256:f4e85e9fddeed49577fd159dd6e96dbc66db246082b884fed208f8db9ad05bbb
          env:
            - name: COUCHDB_URI
              value: http://couchdb.obsidian.svc:5984
            - name: COUCHDB_DBNAME
              value: vault
            - name: COUCHDB_USER
              value: mcp
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb
                  key: MCP_PASSWORD
            - name: HOME
              value: /tmp
          ports:
            - name: mcp
              containerPort: 8765
          readinessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: vault
              mountPath: /vault
            - name: db
              mountPath: /db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: vault
          persistentVolumeClaim:
            claimName: livesync-mcp-vault
        - name: db
          persistentVolumeClaim:
            claimName: livesync-mcp-db
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: livesync-mcp
  namespace: obsidian
  labels:
    app.kubernetes.io/name: livesync-mcp
spec:
  selector:
    app.kubernetes.io/name: livesync-mcp
  ports:
    - name: mcp
      port: 8765
      targetPort: mcp
