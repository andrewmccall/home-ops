---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ashes-map
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/overlays/map
  prune: true
  sourceRef:
    kind: GitRepository
    name: survival
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ashes-dev
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: survival
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ashes-prod
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: survival
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
# Self-hosted GitHub Actions runners for the survival repo (survival ADR 0029):
# Actions Runner Controller and the `vecna` runner scale set in ashes-ci.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ashes-ci
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/overlays/ci
  prune: true
  sourceRef:
    kind: GitRepository
    name: survival
  decryption:
    provider: sops
    secretRef:
      name: sops-age
