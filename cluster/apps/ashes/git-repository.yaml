---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: survival
  namespace: flux-system
spec:
  # Pushes to main trigger a fetch through the survival Receiver
  # (core/flux-system/webhook); polling only catches a missed delivery.
  interval: 30m0s
  ref:
    branch: main
  url: ssh://git@github.com/andrewmccall/survival.git
  secretRef:
    # Read-only deploy key "flux ashes (home-ops)" on the survival repo.
    name: survival-deploy-key
