# Sproozi task service: the MCP server Hermes calls to start the workflows in
# tasks.json (one AgentRun per request). Adapted from the v0.2.4
# examples/orchestration/task-service.yaml; the coordinator is the existing
# Hermes in the hermes namespace, not a separate sproozi-coordinators one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sproozi-tasks
  namespace: sproozi-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sproozi-tasks
  namespace: sproozi-system
rules:
  - apiGroups: [sproozi.com]
    resources: [agentruns]
    verbs: [get, create, patch]
  - apiGroups: [sproozi.com]
    resources: [agenttemplates, agentpolicies]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sproozi-tasks
  namespace: sproozi-system
subjects:
  - kind: ServiceAccount
    name: sproozi-tasks
    namespace: sproozi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sproozi-tasks
---
apiVersion: v1
kind: Service
metadata:
  name: sproozi-tasks
  namespace: sproozi-system
spec:
  selector:
    app.kubernetes.io/component: task-mcp
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sproozi-tasks
  namespace: sproozi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: task-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproozi
        app.kubernetes.io/component: task-mcp
    spec:
      serviceAccountName: sproozi-tasks
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tasks
          image: ghcr.io/andrewmccall/sproozi:0.2.5@sha256:72963b704a30606a27fa9554849c4d90f1e0c3bf66ba1803b82e6593329603cc
          command: [/tasks]
          env:
            - name: SPROOZI_TASK_CONFIG
              value: /etc/sproozi/tasks/tasks.json
            - name: SPROOZI_TASK_TOKEN_FILE
              value: /var/run/task-auth/token
            - name: SPROOZI_TASK_CERT_FILE
              value: /var/run/task-tls/tls.crt
            - name: SPROOZI_TASK_KEY_FILE
              value: /var/run/task-tls/tls.key
          ports:
            - containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/sproozi/tasks
              readOnly: true
            - name: token
              mountPath: /var/run/task-auth
              readOnly: true
            - name: tls
              mountPath: /var/run/task-tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sproozi-tasks
        - name: token
          secret:
            secretName: sproozi-task-token
        - name: tls
          secret:
            secretName: sproozi-task-tls
---
# Only the Hermes pod may call the task service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sproozi-tasks
  namespace: sproozi-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: task-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes
      ports:
        - protocol: TCP
          port: 8443
