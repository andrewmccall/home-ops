---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sproozi
    control-plane: controller-manager
  name: sproozi-controller-manager
  namespace: sproozi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sproozi
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: sproozi
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        image: ghcr.io/andrewmccall/sproozi@sha256:72963b704a30606a27fa9554849c4d90f1e0c3bf66ba1803b82e6593329603cc
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts: []
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sproozi-controller-manager
      terminationGracePeriodSeconds: 10
      volumes: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: shared-gateway
    app.kubernetes.io/name: sproozi
  name: sproozi-gateway
  namespace: sproozi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: shared-gateway
      app.kubernetes.io/name: sproozi
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: shared-gateway
        app.kubernetes.io/name: sproozi
    spec:
      containers:
      - command:
        - /gateway
        env:
        - name: SPROOZI_ENABLED_CAPABILITIES
          value: kubernetes.read,model.inference,github.pull_request,packages.install,network.egress
        - name: SPROOZI_GATEWAY_CERT_FILE
          value: /var/run/sproozi-gateway/tls.crt
        - name: SPROOZI_GATEWAY_KEY_FILE
          value: /var/run/sproozi-gateway/tls.key
        - name: SPROOZI_GATEWAY_HOST
          value: sproozi-gateway.sproozi-system.svc
        - name: AGENT_NAMESPACE
          value: sproozi-agents
        - name: BUDGET_NAMESPACE
          value: sproozi-system
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              key: openai-api-key
              name: model-gateway-credentials
              optional: true
        - name: MODEL_AUTH_MODE
          valueFrom:
            configMapKeyRef:
              key: mode
              name: model-gateway-auth
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              key: anthropic-api-key
              name: model-gateway-credentials
              optional: true
        - name: OPENAI_SIGN_IN_TOKEN
          valueFrom:
            secretKeyRef:
              key: openai-sign-in-token
              name: model-gateway-credentials
              optional: true
        - name: ANTHROPIC_SIGN_IN_TOKEN
          valueFrom:
            secretKeyRef:
              key: anthropic-sign-in-token
              name: model-gateway-credentials
              optional: true
        - name: COPILOT_SIGN_IN_TOKEN
          valueFrom:
            secretKeyRef:
              key: copilot-sign-in-token
              name: model-gateway-credentials
              optional: true
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              key: app-id
              name: capability-proxy-github-app
              optional: true
        - name: GITHUB_APP_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              key: installation-id
              name: capability-proxy-github-app
              optional: true
        - name: GITHUB_APP_PRIVATE_KEY_PATH
          value: /var/run/secrets/sproozi/github-app/private-key.pem
        - name: EGRESS_PROFILES_PATH
          value: /etc/sproozi/egress/profiles.json
        - name: MODEL_PRICING_PATH
          value: /etc/sproozi/model/pricing.json
        - name: MCP_SERVERS_PATH
          value: /etc/sproozi/mcp/servers.json
        - name: SPROOZI_GATEWAY_MAX_CONNECTIONS
          value: "2048"
        - name: SPROOZI_GATEWAY_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: shared-gateway
              resource: limits.memory
        image: ghcr.io/andrewmccall/sproozi@sha256:72963b704a30606a27fa9554849c4d90f1e0c3bf66ba1803b82e6593329603cc
        name: shared-gateway
        ports:
        - containerPort: 8443
          name: proxy
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 25m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /var/run/sproozi-gateway
          name: gateway-tls
          readOnly: true
        - mountPath: /var/run/secrets/sproozi/github-app
          name: github-app
          readOnly: true
        - mountPath: /etc/sproozi/egress
          name: profiles
          readOnly: true
        - mountPath: /etc/sproozi/model
          name: model-pricing
          readOnly: true
        - mountPath: /etc/sproozi/mcp
          name: mcp-servers
          readOnly: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: sproozi-shared-gateway
      terminationGracePeriodSeconds: 45
      volumes:
      - name: gateway-tls
        secret:
          secretName: sproozi-gateway-tls
      - name: github-app
        secret:
          items:
          - key: private-key.pem
            path: private-key.pem
          optional: true
          secretName: capability-proxy-github-app
      - configMap:
          items:
          - key: profiles.json
            path: profiles.json
          name: sproozi-egress-gateway-profiles
        name: profiles
      - configMap:
          items:
          - key: pricing.json
            path: pricing.json
          name: sproozi-model-gateway-pricing
        name: model-pricing
      - configMap:
          items:
          - key: servers.json
            path: servers.json
          name: sproozi-mcp-servers
        name: mcp-servers
