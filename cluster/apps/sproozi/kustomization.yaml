apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - install.yaml
  - certificates.yaml
  - sre.yaml
  - tasks.yaml
  - task-tls.sops.yaml
  - task-token.sops.yaml
  - claude-login.yaml
  - capability-proxy-github-app.sops.yaml
  # Remote executors for Andrew's own sessions (README "Remote executors").
  - executor-claude.yaml
  - executor-claude-credentials.sops.yaml
  - executor-codex.yaml
  - executor-codex-credentials.sops.yaml
configMapGenerator:
  # The SRE runs use Claude Code's own sign-in (a Claude subscription, in the
  # sproozi-login-claude-code-default claim), which the gateway forwards. It
  # holds no Anthropic key or token, or it would use that instead (README).
  - name: model-gateway-auth
    namespace: sproozi-system
    literals:
      - mode=workload
  - name: sproozi-tasks
    namespace: sproozi-system
    files:
      - tasks.json
  # Each executor's configuration and the CA the CLI trusts for it. Both are
  # immutable, because the executor may update other ConfigMaps in its
  # namespace. The configuration's name carries a content hash, so a change
  # is a new ConfigMap and restarts the executor. sproozi-remote-executor is
  # a fixed name the CLI looks up, so Flux replaces it (force) when it changes.
  - name: sproozi-executor-profile
    namespace: sproozi-claude
    files:
      - profile.json=executor-claude.json
    options:
      immutable: true
  - name: sproozi-remote-executor
    namespace: sproozi-claude
    files:
      - ca.crt=executor-claude-ca.crt
    options:
      immutable: true
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/force: enabled
  - name: sproozi-executor-profile
    namespace: sproozi-codex
    files:
      - profile.json=executor-codex.json
    options:
      immutable: true
  - name: sproozi-remote-executor
    namespace: sproozi-codex
    files:
      - ca.crt=executor-codex-ca.crt
    options:
      immutable: true
      disableNameSuffixHash: true
      annotations:
        kustomize.toolkit.fluxcd.io/force: enabled
patches:
  # The gateway refuses to start a capability whose credentials are missing.
  # Enabled: Kubernetes reads, model calls with Claude Code's own sign-in
  # (workload mode) and PRs through the GitHub App (capability-proxy-github-app).
  - target:
      kind: Deployment
      name: sproozi-gateway
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: SPROOZI_ENABLED_CAPABILITIES
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: kubernetes.read,model.inference,github.pull_request
  # This cluster's DNS domain is cluster.andrewmccall.com, not cluster.local.
  - target:
      kind: Deployment
      name: sproozi-certificates
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/args/1
        value: --dns=sproozi-gateway.sproozi-system.svc.cluster.local
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: --dns=sproozi-gateway.sproozi-system.svc.cluster.andrewmccall.com
      # The gateway inspects these upstreams, so its certificate must name them.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.anthropic.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=platform.claude.com
      # Workload mode serves every provider's signed-in hosts, so the gateway
      # refuses to start unless its certificate names OpenAI's and Copilot's too.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.openai.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=chatgpt.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=auth.openai.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.individual.githubcopilot.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.business.githubcopilot.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.enterprise.githubcopilot.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=github.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.github.com
