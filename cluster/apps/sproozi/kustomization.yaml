apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - install.yaml
  - certificates.yaml
  - sre.yaml
  - tasks.yaml
  - task-tls.sops.yaml
  - task-token.sops.yaml
  - claude-login.yaml
  - capability-proxy-github-app.sops.yaml
configMapGenerator:
  # The SRE runs use Claude Code's own sign-in (a Claude subscription, in the
  # sproozi-login-claude-code-default claim), which the gateway forwards. It
  # holds no Anthropic key or token, or it would use that instead (README).
  - name: model-gateway-auth
    namespace: sproozi-system
    literals:
      - mode=workload
  - name: sproozi-tasks
    namespace: sproozi-system
    files:
      - tasks.json
patches:
  # The gateway refuses to start a capability whose credentials are missing.
  # Enabled: Kubernetes reads, model calls with Claude Code's own sign-in
  # (workload mode) and PRs through the GitHub App (capability-proxy-github-app).
  - target:
      kind: Deployment
      name: sproozi-gateway
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: SPROOZI_ENABLED_CAPABILITIES
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: kubernetes.read,model.inference,github.pull_request
  # This cluster's DNS domain is cluster.andrewmccall.com, not cluster.local.
  - target:
      kind: Deployment
      name: sproozi-certificates
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/args/1
        value: --dns=sproozi-gateway.sproozi-system.svc.cluster.local
      - op: replace
        path: /spec/template/spec/containers/0/args/1
        value: --dns=sproozi-gateway.sproozi-system.svc.cluster.andrewmccall.com
      # The gateway inspects these upstreams, so its certificate must name them.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.anthropic.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=platform.claude.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=github.com
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --dns=api.github.com
