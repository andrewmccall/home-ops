# SRE workflows Hermes starts through the task service (tasks.json):
# triage (Haiku, read-only Kubernetes) and fix (Sonnet, may open a home-ops PR).
# Flux substitutes ${...}; shell variables are written $${...} so they reach the Pod.
apiVersion: sproozi.com/v1alpha1
kind: AgentRuntime
metadata:
  name: claude-haiku
  namespace: sproozi-system
spec:
  clientConfig:
    harness: claude-code
    trustBundleConfigMap:
      key: ca-bundle.pem
      name: sproozi-sandbox-trust
    # Claude Code's own login (Claude subscription) in the shared claim
    # sproozi-login-claude-code-default; claude-launch.py keeps it in step.
    signIn:
      claims:
        storageClassName: longhorn
  ephemeralWorkspace:
    sizeLimit: 2Gi
  gatewayEndpoint: https://sproozi-gateway.sproozi-system.svc:8443
  workloadContainers: [agent]
  podTemplate:
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: ghcr.io/andrewmccall/sproozi-native:0.2.6@sha256:d19f3284ee0660c0ceb582bda2e5095b1e486695df51b631fcbb6a84992d386a
          command: [/bin/sh, -ec]
          args:
            - |
              token="$(cat /var/run/sproozi/tokens/gateway/token)"
              proxy="https://sproozi:$${token}@$${SPROOZI_GATEWAY#https://}"
              export HTTP_PROXY="$proxy" HTTPS_PROXY="$proxy" http_proxy="$proxy" https_proxy="$proxy"
              export NO_PROXY='' no_proxy=''
              export HOME=/home/agent
              # Git verifies the HTTPS proxy separately; gh answers git's credential
              # requests with the placeholder token the gateway replaces.
              export GIT_CONFIG_COUNT=4
              export GIT_CONFIG_KEY_0=http.proxySSLCAInfo GIT_CONFIG_VALUE_0=/etc/sproozi/trust/ca-bundle.pem
              export GIT_CONFIG_KEY_1=http.proxyAuthMethod GIT_CONFIG_VALUE_1=basic
              export GIT_CONFIG_KEY_2=credential.helper GIT_CONFIG_VALUE_2='!gh auth git-credential'
              export GIT_CONFIG_KEY_3=protocol.file.allow GIT_CONFIG_VALUE_3=never
              export GIT_AUTHOR_NAME='Sproozi SRE' GIT_COMMITTER_NAME='Sproozi SRE'
              export GIT_AUTHOR_EMAIL='sproozi-sre@users.noreply.github.com' GIT_COMMITTER_EMAIL='sproozi-sre@users.noreply.github.com'
              # Sproozi's helper runs one claude --print, publishes its result and, with
              # a sign-in, keeps the login store in step (Sproozi ADR 0054).
              exec python3 /etc/sproozi/contract/claude-launch.py --model "$SPROOZI_MODEL"
          env:
            - name: SPROOZI_MODEL
              value: claude-haiku-5-5
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
