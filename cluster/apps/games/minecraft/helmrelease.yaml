---
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecreft
  namespace: games
spec:
  interval: 30m
  # Startup downloads the server zip before the health probe can pass.
  timeout: 10m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      minecraft:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.10.3@sha256:ad8243d09604051085702536d1e9fef4b0a97fb308f2f2fa73c3fb56b5f4c580
            env:
              TZ: Europe/London
              EULA: "TRUE"
              SERVER_NAME: "home server"
              OPS: ${MINECRAFT_OPS}
              DIFFICULTY: normal
              # The image downloads this server version at startup. Pinned so a release
              # is a git change that restarts the pod; LATEST only updated on restarts.
              # renovate: datasource=custom.minecraft-bedrock depName=bedrock-server versioning=loose
              VERSION: "1.26.61.1"
            # UDP has no TCP probe; mc-monitor is the image's own HEALTHCHECK.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec: &mc-monitor
                    command: [mc-monitor, status-bedrock, --host, 127.0.0.1, --port, "19132"]
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  exec: *mc-monitor
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  exec: *mc-monitor
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
    service:
      app:
        controller: minecraft
        ports: 
          server:
            port: 19132
            protocol: UDP
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "minecraft.${DOMAIN}"
        type: LoadBalancer
        externalIPs:
          - ${MINECRAFT_IP}
        externalTrafficPolicy: Local
    persistence:
      config:
        existingClaim: minecraft-bedrock-pvc
        globalMounts:
          - path: /data