---
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecreft
  namespace: games
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      # renovate: datasource=helm registryUrl=https://bjw-s-labs.github.io/helm-charts chart=app-template
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      minecraft:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: itzg/minecraft-bedrock-server
              tag: 2026.10.1@sha256:6ff3abf645a88c5aafd88b7cf96d35cdfb1e0977a0c45c465a5b536cb1f1c4f9
            env:
              TZ: Europe/London
              EULA: "TRUE"
              SERVER_NAME: "home server"
              OPS: ${MINECRAFT_OPS}
              DIFFICULTY: normal
    service:
      app:
        controller: minecraft
        ports: 
          server:
            port: 19132
            protocol: UDP
        annotations:
          external-dns.alpha.kubernetes.io/hostname: "minecraft.${DOMAIN}"
        type: LoadBalancer
        externalIPs:
          - ${MINECRAFT_IP}
        externalTrafficPolicy: Local
    persistence:
      config:
        existingClaim: minecraft-bedrock-pvc
        globalMounts:
          - path: /data