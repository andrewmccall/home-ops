---
# The Longhorn UI has no login, so the internal Gateway asks Authentik first
# (the `longhorn` application in apps/authentik/blueprints.yaml; admins only).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: longhorn-ui
  namespace: longhorn
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn-ui
  oidc:
    provider:
      issuer: https://auth.${DOMAIN}/application/o/longhorn/
    clientID: longhorn
    clientSecret:
      name: longhorn-oidc
    redirectURL: https://longhorn.${DOMAIN}/oauth2/callback
    logoutPath: /oauth2/logout
