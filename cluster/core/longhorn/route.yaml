---
# The Longhorn UI on the LAN-only Gateway, behind an Authentik login (securitypolicy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - longhorn.${DOMAIN}
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
