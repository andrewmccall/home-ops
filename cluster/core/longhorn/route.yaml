---
# The Longhorn UI on the LAN-only Gateway. It has no login of its own: until the
# Gateway's OIDC login is in place, anyone on the LAN who knows the host can manage
# storage. See cluster/apps/networking/README.md.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn
spec:
  parentRefs:
    - name: internal
      namespace: networking
      sectionName: https
  hostnames:
    - longhorn.${DOMAIN}
  rules:
    - backendRefs:
        - name: longhorn-frontend
          port: 80
