---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
  labels:
    # Longhorn cannot be downgraded, so a failed upgrade stays failed for a human to fix.
    # Its pre-upgrade job rejects unsupported version jumps before anything changes.
    home-ops.andrewmccall.com/remediation: manual
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      # renovate: datasource=helm registryUrl=https://charts.longhorn.io chart=longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    # 1.12 adds internal NetworkPolicies that Calico enforces; 1.12.1 has known CNI
    # breakage (volumes stuck attaching), fixed in 1.12.2. Keep the pre-1.12 behaviour.
    networkPolicies:
      restrictInternalTraffic: false
    defaultSettings:
      # Was 0, which left volumes on engines as old as v1.7.0 across upgrades. One at a
      # time live-upgrades each volume to the manager's engine after every upgrade.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    persistence:
      defaultClassReplicaCount: 1
    metrics:
      serviceMonitor:
        enabled: true
