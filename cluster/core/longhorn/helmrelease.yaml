---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn
  labels:
    # Longhorn cannot be downgraded, so a failed upgrade stays failed for a human to fix.
    # Its pre-upgrade job rejects unsupported version jumps before anything changes.
    home-ops.andrewmccall.com/remediation: manual
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      # renovate: datasource=helm registryUrl=https://charts.longhorn.io chart=longhorn
      version: 1.11.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    persistence:
      defaultClassReplicaCount: 1
    metrics:
      serviceMonitor:
        enabled: true
