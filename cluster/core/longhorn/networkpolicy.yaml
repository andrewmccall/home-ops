---
# Longhorn's manager API (9500) and UI can delete every volume, and pod addresses are
# routed to the LAN, so without this any device on the network could manage storage.
# Pods here accept traffic from this namespace (all of Longhorn's own traffic, left
# unrestricted: the chart's internal policies are off, see helmrelease.yaml),
# Prometheus (metrics) and the Envoy Gateways (the UI). The node's iSCSI and kubelet
# traffic and the API server's webhook calls come from the node, which Calico always allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
  namespace: longhorn
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: envoy-gateway
              app.kubernetes.io/component: proxy
