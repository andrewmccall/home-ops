---
# Upgrades k3s to the version in server-plan.yaml, inside its maintenance window.
# The Plan CRD comes from cluster/crds/system-upgrade-controller at the same tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github.com/rancher/system-upgrade-controller?ref=v0.21.0
  - server-plan.yaml
  - health-check-rbac.yaml
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.21.0@sha256:52f31eb3f2dcd3c937c8390bcb90d8a7f019832d9b131690a51c3f95decad443
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: system-upgrade-controller
      app.kubernetes.io/instance: system-upgrade-controller
