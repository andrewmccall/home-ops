---
# The upgrade controller serves nothing; pods here accept only each other. Pod
# addresses are routed to the LAN over BGP (cluster/apps/networking/README.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
  namespace: system-upgrade
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
