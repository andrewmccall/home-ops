---
# Pods here accept only this namespace and Prometheus. Pod addresses are routed to the
# LAN over BGP (cluster/apps/networking/README.md); the API server's webhook calls come
# from the node, which Calico always allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default
  namespace: agent-sandbox-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
