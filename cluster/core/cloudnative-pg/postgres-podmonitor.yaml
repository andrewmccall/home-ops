---
# Metrics from every CloudNativePG instance in any namespace (port 9187), so each
# Cluster is monitored without configuring it in the repository that defines it.
# Feeds the CloudNativePG dashboard and the Postgres alerts
# (apps/monitoring/alerts/postgres-rules.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: cnpg-system
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
